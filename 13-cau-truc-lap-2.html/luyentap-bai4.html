        function Fibonacci() {
            let count = 3;
            let solg = +document.getElementById("solg").value;
            let F1 = 0;
            let F2 = 1;
            let F = 0;
            let text = "0; 1; ";
            let M ="";
            while (count<=solg) {
                F = F1 + F2;
                if (F%5==0) {
                    M += F + "; ";
                } 
                text += F +"; ";
                F1 = F2;
                F2 = F;
                count++;
            }
            console.log(text);
            console.log(M);
            document.getElementById("show").innerHTML=text;
            if (M=="") {
                document.getElementById("chiahetcho5").innerHTML="Không có số chia hết cho 5";
            } else {
                document.getElementById("chiahetcho5").innerHTML=M;
            }

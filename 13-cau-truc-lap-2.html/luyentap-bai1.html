<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bài 1</title>
</head>
<body>
    <p id="hienthi"></p>
    <script>
        // Sử dụng vòng lặp để đếm từ 1 đến 100. Khi số là 99, 
        // hiển thị hộp thoại thông báo đã hoàn thành.
        let i = 1;
        let text = "";
        while (i<=100) {
            if (i==99) { 
                alert("Hoàn thành");
            }
            text += i+"; ";
            i++;
        }
        document.getElementById("hienthi").innerHTML=text;
    </script>
</body>
</html>

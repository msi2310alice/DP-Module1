<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 4</title>
</head>
<style>
    div {
        font-size: 30px;
    }
</style>
<body>
    <div id="canh"></div>
    <script>
        function chieudai(n) {
            let dai="";
            let i = 1;
            while (i<=n) {
                dai += "*";
                i++;
            }
            dai += "<br>";
            return dai;
        }
        function rong(m) {
            let rong ="";
            let j = 1;
            while (j<=m) {
                switch(j) {
                    case 1: 
                        rong += "*";
                        break;
                    case m: 
                        rong += "*";
                        break;
                    default:
                        rong += "&nbsp;&nbsp;";
                } 
                j++;

            }
            rong += "<br>";
            return rong;
        }

        // document.getElementById("canh").innerHTML= chieudai(21);
        // document.getElementById("canh").innerHTML= rong(21);

        let hcn = "";
        hcn = chieudai(21);
        let dorong = 1;
        while (dorong<=6) {
            hcn += rong(21);
            dorong++;
        }
        hcn += chieudai(21);
        document.getElementById("canh").innerHTML=hcn;


        
    </script>
</body>
</html>

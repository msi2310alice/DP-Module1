<body>
    <script>
        function giaithua(number) {
            if (number < 0) {
                alert("Hãy nhập lại số nguyên dương")
            } else { 
                let i = 1;
                let tinh = 1;
                while (i <= number) {
                    tinh *= i;
                    i++;
                }
            console.log(tinh);
            }
        }
        giaithua(-9);
    </script>

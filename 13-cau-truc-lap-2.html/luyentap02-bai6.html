        function veline(n) {
            let i = 1;
            let line = "*";
            while (i <= n) {
                line += "*";
                i++
            }
            return line;
        }
        function vekhoangtrang(n) {
            let i = 1;
            let line = "&nbsp;";
            while (i <= n) {
                line += "&nbsp;&nbsp;";
                i++
            }
            return line;

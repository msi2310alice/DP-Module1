<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p id="hienthi"></p>
    <script>

        // bài 1
        let myColor = ["Red", "Green", "White","Black"];
        let text = '"';
        for (let i = 0; i < myColor.length; i++) {
            text += myColor[i] + ",";
        }
        text += '"';
        document.getElementById("hienthi").innerHTML=text;
    </script>
</body>
</html>
